<title>Hästliv</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#2b1745;--pink:#ff4f9a;--pink2:#ff9cc8;--mint:#2fd6a6;--sun:#ffcf33;--sky:#5cc2ff;--purple:#8a5cff;--cream:#fff8ef;--red:#ff5a4f;--orange:#ff8a3d;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,sans-serif;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
html,body{margin:0;height:100%;overflow:hidden;background:#a8dcff;font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;z-index:10;pointer-events:none}
.screen>*{pointer-events:auto}
button{font-family:inherit;color:inherit}
.btn{font-family:var(--display);font-size:22px;letter-spacing:.02em;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:10px 20px;cursor:pointer;transition:transform .08s,box-shadow .08s;line-height:1.1;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;text-shadow:0 2px 0 rgba(43,23,69,.35)}
.btn.mint{background:var(--mint)}
.btn.white{background:#fff}
.btn.purple{background:var(--purple);color:#fff}
.btn.sky{background:var(--sky)}
.btn.small{font-size:16px;padding:7px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
.round{width:54px;height:54px;border-radius:50%;padding:0;font-size:24px;display:flex;align-items:center;justify-content:center}

/* ---------- titel ---------- */
#title{display:flex;align-items:center;justify-content:center}
.titlebox{text-align:center;padding:24px;max-width:560px;width:100%}
.logo{font-family:var(--display);font-size:clamp(64px,13vw,128px);line-height:.9;transform:rotate(-5deg);display:inline-block;position:relative;filter:drop-shadow(0 8px 0 var(--ink))}
.logo span{display:inline-block;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.logo span:last-child{color:var(--pink)}
.logo i{position:absolute;font-style:normal;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;font-size:.42em;animation:twinkle 1.6s ease-in-out infinite}
.logo i.a{right:-.35em;top:-.25em}.logo i.b{left:-.45em;bottom:-.05em;animation-delay:.6s;font-size:.3em}
@keyframes twinkle{50%{transform:scale(1.3) rotate(20deg)}}
.tag{font-family:var(--display);font-size:clamp(18px,3.4vw,26px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;margin:22px 0 22px;transform:rotate(-2deg)}
.titlebtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn.big{font-size:32px;padding:14px 38px;border-radius:24px;box-shadow:0 7px 0 var(--ink)}
.allgames{display:inline-block;margin-top:22px;font-weight:900;color:var(--ink);background:rgba(255,255,255,.75);border-radius:999px;padding:6px 14px;text-decoration:none;border:2px solid var(--ink)}
.appfoot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;justify-content:center;padding:8px 12px calc(var(--sb) + 8px);font-size:14px;font-weight:800;color:var(--ink)}
.appfoot>span{background:rgba(255,255,255,.75);padding:4px 10px;border-radius:999px}
.updBtn{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;cursor:pointer}

/* ---------- skapa ---------- */
.cpanel{position:absolute;left:calc(var(--sl) + 14px);top:calc(var(--st) + 14px);bottom:calc(var(--sb) + 14px);width:min(430px,46vw);background:var(--cream);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden}
.ctabs{display:flex;gap:8px;padding:12px 12px 0}
.ctab{flex:1;font-family:var(--display);font-size:20px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px;cursor:pointer}
.ctab.on{background:var(--pink);color:#fff}
.ctab:disabled{opacity:.5}
.cbody{flex:1;overflow-y:auto;padding:6px 16px 10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.crow{margin:12px 0 4px}
.crow h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 7px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;padding:0;position:relative;touch-action:manipulation}
.sw button.on{outline:4px solid var(--pink);outline-offset:2px}
.sw button.rainbow{background:conic-gradient(#ff4f4f,#ffcf33,#2fd6a6,#3fa8ff,#8a5cff,#ff4f9a,#ff4f4f)!important}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:3px solid var(--ink);background:#fff;border-radius:999px;font-weight:900;font-size:15px;padding:6px 12px;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;gap:6px}
.chips button.on{background:var(--sun)}
.chips button i{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.nameIn{width:100%;font-family:var(--display);font-size:22px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff;color:var(--ink);outline:none;user-select:text;-webkit-user-select:text}
.cfoot{display:flex;gap:10px;justify-content:space-between;padding:10px 14px 14px;border-top:3px dashed rgba(43,23,69,.18)}
.chint{position:absolute;right:calc(var(--sr) + 18px);bottom:calc(var(--sb) + 18px);background:rgba(255,255,255,.8);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px;pointer-events:none}

/* ---------- HUD ---------- */
.hudL{position:absolute;left:calc(var(--sl) + 12px);top:calc(var(--st) + 10px);display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
.pills{display:flex;gap:8px}
.pill{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 8px;font-family:var(--display);font-size:20px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:6px}
.pill svg{width:22px;height:22px}

<script>

const APP_VERSION='0.9';

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const TRACK={cx:-20,cz:50,A:24,rc:10.5,w:5};TRACK.L=4*TRACK.A+2*Math.PI*TRACK.rc;

  let n=0;const parts=list.map(o=>{let g=o.geo.index?o.geo.toNonIndexed():o.geo.clone();if(o.m)g.applyMatrix4(o.m);n+=g.attributes.position.count;return {g,color:o.color}});
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3);let off=0;

function rebuildHorses(){G.horses.forEach(h=>scene.remove(h.m.g));G.horses=S.horses.map((d,i)=>spawnHorse(d,i));L.boxes.forEach((b,i)=>setPlate(i,S.horses[i]?S.horses[i].name:''));}
function spawnHorse(d,i){const m=makeHorse(d);scene.add(m.g);
  const h={d,m,i,pos:new V3(),yaw:0,speed:0,state:d.loc==='hage'?'hage':'box',jumpT:-1,jumpDur:.8,jumpApex:0,jumpY:0,prev:new Map(),w:{mode:'graze',t:rand(2,6),x:0,z:0,sp:0},sayT:rand(6,16),
    eatT:0,lift:-1,liftT:0,happyT:0,buckT:0,dirtT:0,galT:0,beatT:0,look:0};
  placeHorse(h);m.setDirt(dirtCount(h));if(STABLE.hay[i])STABLE.hay[i].visible=!!(d.ready&&d.ready.hay);return h}
function placeHorse(h){if(h.state==='box'){h.pos.set(L.boxes[h.i],0,-12.05-1.3*breedOf(h.d.breed).s);h.yaw=0;h.m.setTack(false)}
  else if(h.state==='hage'){h.pos.set(rand(15,38),0,rand(-33,-14));h.yaw=rand(-3,3);h.w.mode='graze';h.w.t=rand(1,5)}
  h.pos.y=groundH(h.pos.x,h.pos.z)}
function dirtCount(h){return Math.round(clamp((100-h.d.st.clean)/100,0,1)*h.m.dirt.length)}
function hName(){const h=G.horses[G.ride>=0?G.ride:G.lead>=0?G.lead:0];return h?h.d.name:'hästen'}
function curHorse(){return G.horses[G.ride>=0?G.ride:G.lead>=0?G.lead:0]}

// ---------- prat ----------
function say(h,cat,force){if(!h)return;const arr=Array.isArray(cat)?cat:HORSE_LINES[cat];if(!arr)return;
  if(!force&&h.say&&h.say.t>0)return;h.say={text:pick(arr),t:3.4};h.sayT=rand(18,32);if(Math.random()<.4)Snd.snort()}
function autoSay(h,dt){h.sayT-=dt;if(h.say)h.say.t-=dt;if(h.sayT>0)return;
  const st=h.d.st;if(h.pos.distanceTo(G.cam.focus)>22){h.sayT=5;return}
  if(st.hunger<30)say(h,'hungry');else if(st.thirst<30)say(h,'thirsty');else if(st.clean<30)say(h,'dirty');else if(st.energy<20)say(h,'tired');
  else if(h.state==='hage')say(h,Math.random()<.5?'hage':'happy');else say(h,'happy')}

// ---------- behov ----------
function updateNeeds(dt){G.horses.forEach(h=>{const st=h.d.st;
  st.hunger-=dt/26*(h.state==='hage'?.4:1);st.thirst-=dt/20;
  st.clean-=dt*(h.state==='hage'?1/40:h.state==='ride'?(h.speed>6?1/22:1/50):1/150);
  if(h.state==='box')st.energy+=dt*.6;else if(h.state==='hage')st.energy+=dt*.9;else if(h.state==='lead')st.energy+=dt*.25;
  else if(h.state==='ride')st.energy-=dt*(h.speed<2.5?.02:h.speed<6?.18:.45);
  const base=50+((st.hunger+st.thirst+st.clean)/3-50)*.9+(h.state==='hage'?12:0);st.mood+=clamp(base-st.mood,-1,1)*dt/5;
  for(const k in st)st[k]=clamp(st[k],0,100);
  if(h.state==='box'){h.dirtT+=dt;if(h.dirtT>100){h.dirtT=0;h.d.dirt=Math.min(6,h.d.dirt+1)}}
  const dc=dirtCount(h);if(dc!==h.lastDc&&G.sub!=='brush'){h.m.setDirt(dc);h.lastDc=dc}})}

// ---------- input ----------
function moveVec(){let x=G.joy.x,y=G.joy.y;const k=G.keys;
  if(k.ArrowLeft||k.KeyA)x-=1;if(k.ArrowRight||k.KeyD)x+=1;if(k.ArrowUp||k.KeyW)y-=1;if(k.ArrowDown||k.KeyS)y+=1;
  let len=Math.hypot(x,y);if(len>1){x/=len;y/=len;len=1}if(len<.08)return {x:0,z:0,len:0};
  const a=G.cam.yaw,fx=Math.sin(a),fz=Math.cos(a),rx=-Math.cos(a),rz=Math.sin(a);
  const mx=fx*-y+rx*x,mz=fz*-y+rz*x;return {x:mx,z:mz,len}}

// ---------- till fots ----------
function updateFoot(dt){const mv=moveVec();
  const spd=mv.len>.05?(G.lead>=0?Math.min(2.6,lerp(1.4,2.6,mv.len)):lerp(1.4,4.8,mv.len)):0;
  player.speed=damp(player.speed,spd,10,dt);if(mv.len>.05)player.yaw=dampA(player.yaw,Math.atan2(mv.x,mv.z),12,dt);
  player.pos.x+=Math.sin(player.yaw)*player.speed*dt;player.pos.z+=Math.cos(player.yaw)*player.speed*dt;
  collide(player.pos,.38);G.horses.forEach(h=>{if(h.state==='hage'||h.state==='lead'){const dx=player.pos.x-h.pos.x,dz=player.pos.z-h.pos.z,d=Math.hypot(dx,dz);if(d<1.05&&d>.01){player.pos.x=h.pos.x+dx/d*1.05;player.pos.z=h.pos.z+dz/d*1.05}}});
  player.pos.y=groundH(player.pos.x,player.pos.z);
  const pm=player.model;pm.g.position.copy(player.pos);pm.g.rotation.y=player.yaw;
  if(pm.animate(dt,{speed:player.speed,lead:G.lead>=0,cheer:player.cheer>0,work:player.work>0})&&player.speed>.5){
    const sf=surfaceAt(player.pos.x,player.pos.z);if(sf==='water'){Snd.clop('water',.5);PT.emit('splash',player.pos.x,player.pos.y,player.pos.z,4,{size:.6})}else Snd.step()}
  player.cheer-=dt;player.work-=dt;
  if(G.lead>=0)followLead(G.horses[G.lead],dt)}
function followLead(h,dt){const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);const tx=player.pos.x-sy*.8-cy*1.35,tz=player.pos.z-cy*.8+sy*1.35;
  const dx=tx-h.pos.x,dz=tz-h.pos.z,d=Math.hypot(dx,dz);
  if(d>14){h.pos.set(tx,0,tz);h.speed=0}
  const want=d>.35?clamp((d-.25)*2.4,0,5):0;h.speed=damp(h.speed,want,5,dt);
  if(d>.3)h.yaw=dampA(h.yaw,Math.atan2(dx,dz),4.5,dt);else h.yaw=dampA(h.yaw,player.yaw,2,dt);
  h.pos.x+=Math.sin(h.yaw)*h.speed*dt;h.pos.z+=Math.cos(h.yaw)*h.speed*dt;collide(h.pos,.6);h.pos.y=groundH(h.pos.x,h.pos.z)}
function updateRope(){const show=G.lead>=0&&(G.mode==='play');G.rope.visible=show;if(!show)return;const h=G.horses[G.lead];
  const a=TMP;player.model.arms[1].el.getWorldPosition(a);a.y-=.2;const b=TMP2;h.m.muzzle.getWorldPosition(b);b.y-=.15;
  const arr=G.rope.geometry.attributes.position.array;const d=a.distanceTo(b);
  for(let i=0;i<10;i++){const t=i/9;arr[i*3]=lerp(a.x,b.x,t);arr[i*3+1]=lerp(a.y,b.y,t)-Math.sin(t*Math.PI)*Math.max(.05,.6-d*.15);arr[i*3+2]=lerp(a.z,b.z,t)}
  G.rope.geometry.attributes.position.needsUpdate=true}

// ---------- ridning ----------
function maxGait(h){const st=h.d.st;if(st.hunger<10||st.thirst<10)return 1;if(st.energy<8)return 1;return 3}
function updateRide(dt){const h=G.horses[G.ride],st=h.d.st;const mv=moveVec();const air=h.jumpT>=0;
  let tgt=0;if((G.comp&&!G.comp.go)||(G.race&&!G.race.go))tgt=0;else if(mv.len>.12){tgt=mv.len<.62?1.9:4.6;if(G.gallop&&mv.len>.45)tgt=G.cart?6.8:8.2;if(G.race&&G.race.spurt>0&&tgt>4)tgt=9.6}
  const mg=maxGait(h);if(tgt>1.9&&mg<2){tgt=1.9;if(G.t-G.refuse>6){G.refuse=G.t;say(h,st.energy<8?'tired':st.hunger<10?['Jag kör inte på tom mage!']:['Inte utan vatten!'],true);note(st.energy<8?'Hästen är för trött – låt den vila i hagen eller boxen.':'Hästen behöver mat och vatten först!')}}
  if(!air)h.speed=damp(h.speed,tgt,tgt>h.speed?1.5:2.6,dt);
  if(mv.len>.12&&!(G.comp&&!G.comp.go)){const want=Math.atan2(mv.x,mv.z);const rate=(air?.4:1)*lerp(2.8,1.55,clamp(h.speed/8,0,1));h.yaw+=clamp(wrapA(want-h.yaw),-rate*dt,rate*dt)}
  h.pos.x+=Math.sin(h.yaw)*h.speed*dt;h.pos.z+=Math.cos(h.yaw)*h.speed*dt;
  const bx=h.pos.x,bz=h.pos.z;collide(h.pos,.75);const hit=Math.hypot(h.pos.x-bx,h.pos.z-bz);if(hit>.02&&h.speed>3)h.speed*=.95;
  if(air){h.jumpT+=dt;const j=h.jumpT/h.jumpDur;if(j>=1){h.jumpT=-1;h.jumpY=0;Snd.thud();const sf=surfaceAt(h.pos.x,h.pos.z);PT.emit(sf==='water'?'splash':sf==='sand'?'sand':'dust',h.pos.x,h.pos.y+.1,h.pos.z,sf==='water'?18:10,{r:1})}else h.jumpY=h.jumpApex*Math.sin(Math.PI*j)}
  h.pos.y=groundH(h.pos.x,h.pos.z)+h.jumpY;
  checkJumps(h);
  // ytor & effekter
  const sf=surfaceAt(h.pos.x,h.pos.z);
  if(sf==='water'&&h.speed>1.2){if(Math.random()<dt*(h.speed*3))PT.emit('splash',h.pos.x+rand(-.5,.5),LASTWY+.05,h.pos.z+rand(-.6,.6),3,{vx:Math.sin(h.yaw)*h.speed*.3,vz:Math.cos(h.yaw)*h.speed*.3});
    if(h.speed>4&&Math.random()<dt*8)PT.emit('spray',h.pos.x,LASTWY+.3,h.pos.z,2,{r:1});
    h.wetT=(h.wetT||0)+dt;if(h.wetT>2.5){quest('beach');if(!h.saidBeach){h.saidBeach=1;say(h,'beach',true)}}}
  else if(h.speed>5&&!air&&Math.random()<dt*6)PT.emit(sf==='sand'?'sand':'dust',h.pos.x-Math.sin(h.yaw)*.8,h.pos.y+.05,h.pos.z-Math.cos(h.yaw)*.8,2,{r:.6});
  if(h.d.breed==='unicorn'&&h.speed>1&&Math.random()<dt*14)PT.emit(Math.random()<.2?'heart':'sparkle',h.pos.x-Math.sin(h.yaw)*.9,h.pos.y+1,h.pos.z-Math.cos(h.yaw)*.9,1,{r:.6,color:pick(['#ff4f4f','#ffd93d','#3fd67c','#3fa8ff','#8a5cff','#ff86bd'])});
  if(h.d.acc.glitter&&h.speed>2&&Math.random()<dt*10)PT.emit('sparkle',h.pos.x,h.pos.y+.2,h.pos.z,1,{r:.8});
  if(h.speed>6){h.galT+=dt;if(h.galT>=20){quest('gallop')}}
  if(G.comp)updateComp(dt,h);if(G.race)updateRace(dt,h)}
function doJump(){if(G.race){raceSpurt();return}if(G.cart){note('Man kan inte hoppa med vagn! 😅');return}const h=G.horses[G.ride];if(!h||h.jumpT>=0)return;if(G.comp&&!G.comp.go)return;
  if(h.speed<1.2){note('Rid framåt först – sen HOPPA!');return}
  if(h.d.st.energy<4){say(h,'tired',true);return}
  const st=h.d.st,f=.78+.22*clamp(st.energy/50,0,1)+.1*clamp((st.mood-50)/50,0,1)+Math.min(.15,h.d.xp*.004)+(h.d.breed==='unicorn'?.12:0);
  h.jumpApex=(.42+.86*clamp(h.speed/8,0,1))*f;h.jumpDur=.72+.16*clamp(h.speed/8,0,1);h.jumpT=0;st.energy-=1.5;Snd.whoosh();
  if(G.ride>=0){const sf=surfaceAt(h.pos.x,h.pos.z);PT.emit(sf==='water'?'splash':sf==='sand'?'sand':'dust',h.pos.x,h.pos.y+.1,h.pos.z,8,{r:.8})}}
function activeJumps(){return G.comp?G.jumps.venue:G.jumps.home.concat(G.jumps.venue)}
function checkJumps(h){for(const J of activeJumps()){const dx=h.pos.x-J.x,dz=h.pos.z-J.z;if(dx*dx+dz*dz>81){h.prev.delete(J);continue}
  const s=dx*J.dx+dz*J.dz,lat=dx*J.sx+dz*J.sz,prev=h.prev.get(J);h.prev.set(J,s);
  if(prev===undefined||Math.sign(prev)===Math.sign(s)||s===0)continue;if(Math.abs(lat)>J.w/2+.35)continue;
  const need=J.h-(J.oxer?.1:.2);const ok=h.jumpY>=need&&!J.knocked;
  if(G.comp){const c=G.comp;if(c.course[c.next]!==J){if(J!==c.lastJ)note('Fel hinder! Följ pilen ➜');c.lastJ=J;continue}c.lastJ=J;c.next++;if(!ok)c.faults+=4;
    VENUE.crowd.cheer=ok?1.4:0;if(ok)Snd.cheer()}
  if(ok){Snd.pop();PT.emit('sparkle',h.pos.x,h.pos.y+1.5,h.pos.z,14,{r:1.5});h.d.xp++;S.stat.jumps++;G.streak=(G.streak||0)+1;
    if(!G.comp&&Math.random()<.35)say(h,'clean',true);if(!G.comp)toast(pick(['Snyggt! ✨','Wow! 🌟','Perfekt!','Proffs! 😎']));quest('jump');quest('jump3');h.d.st.mood=Math.min(100,h.d.st.mood+3)}
  else{J.knock(s>prev?1:-1);Snd.knock();G.streak=0;toast('Rivning! 🙈');if(Math.random()<.5)say(h,'knock',true);if(!G.comp)setTimeout(()=>J.reset(),3500)}}}

// ---------- grinden ----------
function setGate(open,quiet){HAGE.open=open;COL.segs=COL.segs.filter(s=>s!==HAGE.seg);if(!open)COL.segs.push(HAGE.seg);if(!quiet){Snd.knock();note(open?'Grinden är öppen 🔓':'Grinden är stängd 🔒 – hästarna stannar i hagen.')}}
function updateGate(dt){if(!HAGE.g1)return;HAGE.g1.rotation.y=damp(HAGE.g1.rotation.y,HAGE.open?-1.25:0,5,dt);HAGE.g2.rotation.y=damp(HAGE.g2.rotation.y,HAGE.open?1.25:0,5,dt)}
// ---------- lös häst ----------
function catchLoose(h){if(G.lead>=0)return;h.state='lead';G.lead=h.i;h.w.mode='graze';say(h,['Okej, okej. Jag kommer.','Det var kul så länge det varade.'],true);Snd.snort()}

// ---------- hagen ----------
const HG_IN=[11.4,40.6,-34.6,-11.4];
function updateHage(h,dt){const w=h.w,st=h.d.st;w.t-=dt;let graze=false,buck=0;
  // öppen grind och ingen i närheten: hästen kan smita
  const pd=Math.hypot(player.pos.x-10,player.pos.z+23);
  if(HAGE.open&&w.mode!=='toGate'&&w.mode!=='escape'&&pd>8&&G.mode==='play'){h.escT=(h.escT||0)+dt;if(h.escT>15){startEscape(h);h.escT=0}}else h.escT=0;
  if(w.mode==='graze'){h.speed=damp(h.speed,0,4,dt);graze=w.t>.6;if(w.t<=0){const r=Math.random();
      w.mode=r<.18?'zoom':'walk';w.sp=w.mode==='zoom'?rand(5,7.5):rand(1.2,1.8);w.x=rand(HG_IN[0]+1,HG_IN[1]-1);w.z=rand(HG_IN[2]+1,HG_IN[3]-1);
      if(w.mode==='zoom'){h.buckT=.8;if(Math.random()<.5)Snd.neigh()}}}
  else{const dx=w.x-h.pos.x,dz=w.z-h.pos.z,d=Math.hypot(dx,dz);
    h.speed=damp(h.speed,d>1?w.sp:0,2,dt);h.yaw=dampA(h.yaw,Math.atan2(dx,dz),2.5,dt);
    if(w.mode==='escape'&&d<1.4){goLoose(h)}
    else if(d<1.2){if(w.mode==='toGate'){h.state='lead';G.lead=h.i;w.mode='graze';say(h,'lead',true);note(h.d.name+' följer med dig nu.')}
      else{w.mode='graze';w.t=rand(5,12)}}}
  h.pos.x+=Math.sin(h.yaw)*h.speed*dt;h.pos.z+=Math.cos(h.yaw)*h.speed*dt;
  if(w.mode!=='toGate'&&w.mode!=='escape'){h.pos.x=clamp(h.pos.x,HG_IN[0],HG_IN[1]);h.pos.z=clamp(h.pos.z,HG_IN[2],HG_IN[3])}
  const tx=h.pos.x-34,tz=h.pos.z+16,td=Math.hypot(tx,tz);if(td<1.8){h.pos.x=34+tx/td*1.8;h.pos.z=-16+tz/td*1.8}
  h.pos.y=groundH(h.pos.x,h.pos.z);if(h.buckT>0){h.buckT-=dt;buck=Math.max(0,Math.sin(h.buckT*12))*clamp(h.buckT,0,1)}
  return {graze,buck}}

function updateHorses(dt){G.horses.forEach(h=>{let o={speed:h.speed};
  if(h.state==='box'){h.speed=0;if(h.careMode){o.graze=h.eatT>0;o.lift=h.liftT>0?h.lift:-1;o.look=h.look;o.happy=h.happyT>0}else{o.graze=false;o.look=Math.sin(G.t*.3+h.i)*.25}
    if(h.eatT>0){h.eatT-=dt;if(Math.random()<dt*1.5)Snd.munch();if(h.eatT<=0){STABLE.hay[h.i].visible=false;STABLE.feed[h.i].visible=false}}}
  else if(h.state==='hage'){const r=updateHage(h,dt);o.graze=r.graze;o.buck=r.buck;o.speed=h.speed}
  else if(h.state==='loose'){const r=updateLoose(h,dt);o.graze=r.graze;o.speed=h.speed}
  else if(h.state==='ride'){o.jump=h.jumpT>=0?h.jumpT/h.jumpDur:-1;o.speed=h.speed}
  else if(h.state==='lead'){o.speed=h.speed}
  else if(h.state==='trailer'||h.state==='hidden'){h.m.g.visible=false;return}
  h.m.g.visible=true;if(h.liftT>0)h.liftT-=dt;if(h.happyT>0)h.happyT-=dt;o.swish=h.d.st.mood<35;o.annoyed=h.d.st.mood<25;o.happy=o.happy||h.happyT>0;
  h.m.g.position.copy(h.pos);h.m.g.rotation.y=h.yaw;
  const beat=h.m.animate(dt,o);
  if(beat&&h.speed>.6&&h.pos.distanceTo(G.cam.focus)<30){const sf=surfaceAt(h.pos.x,h.pos.z);Snd.clop(sf,h.state==='ride'?1:.6);
    if(sf==='water')PT.emit('splash',h.pos.x+rand(-.3,.3),LASTWY+.04,h.pos.z+rand(-.4,.4),h.speed>4?5:2,{size:h.speed>4?1.1:.7})}
  if(G.mode==='play'||G.mode==='comp')autoSay(h,dt)});
  G.npcs.forEach(n=>{n.m.animate(dt,{speed:0,look:Math.sin(G.t*.4+n.ph)*.3});n.r.animate(dt,{ride:true})})}

  if(G.mode==='title'){const a=G.t*.06;c.focus.set(-2,1.5,-12);camera.position.set(-2+Math.sin(a)*30,11+Math.sin(G.t*.13)*2,-12+Math.cos(a)*30);camera.lookAt(c.focus);sunFollow(c.focus);return}

  c.focus.x=damp(c.focus.x,fx,14,dt);c.focus.z=damp(c.focus.z,fz,14,dt);c.focus.y=damp(c.focus.y,fy,6,dt);
  const moving=riding?ent.speed>.8:player.speed>.6;const yawT=riding?ent.yaw:player.yaw;
  if(G.t-c.lastDrag>1.4&&moving)c.yaw=dampA(c.yaw,yawT,riding?2:1.1,dt);
  if(G.t-c.lastDrag>3){const tp=c.focus.x<-560?.14:.36;if(Math.abs(c.pitch-tp)>.01&&(c.focus.x<-560||c.pitch<.2))c.pitch=damp(c.pitch,tp,1.5,dt)}
  const dist=riding?7.2+ent.speed*.28:5.8;c.dist=damp(c.dist||dist,dist,3,dt);
  const cp=Math.cos(c.pitch);const px=c.focus.x-Math.sin(c.yaw)*c.dist*cp,pz=c.focus.z-Math.cos(c.yaw)*c.dist*cp;let py=c.focus.y+Math.sin(c.pitch)*c.dist;
  py=Math.max(py,groundH(px,pz)+.6,LASTWY+.5);camera.position.set(px,py,pz);camera.lookAt(c.focus);
  const fov=riding?55+clamp((ent.speed-4)*1.6,0,8):55;if(Math.abs(camera.fov-fov)>.05){camera.fov=damp(camera.fov,fov,3,dt);camera.updateProjectionMatrix()}

function parkCar(where){const c=G.car;if(where==='home'){c.g.position.set(L.car.x,groundH(L.car.x,L.car.z),L.car.z);c.g.rotation.y=-Math.PI/2}
  else{c.g.position.set(-124,groundH(-124,4),4);c.g.rotation.y=-Math.PI/2+.2}c.ramp.rotation.x=0;
  COL.rects=COL.rects.filter(r=>!r.car);if(where==='home'){const r=[L.car.x-2.3,L.car.x+7.6,L.car.z-1.15,L.car.z+1.15];r.car=1;COL.rects.push(r)}}
function pathPoint(P,t){// t: 0..1 längs polyline
  let tot=0;const seg=[];for(let i=0;i<P.length-1;i++){const l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);seg.push(l);tot+=l}
  let d=t*tot;for(let i=0;i<seg.length;i++){if(d<=seg[i]||i===seg.length-1){const u=clamp(d/seg[i],0,1);return {x:lerp(P[i][0],P[i+1][0],u),z:lerp(P[i][1],P[i+1][1],u),a:Math.atan2(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]),tot}}d-=seg[i]}}
function drive(dest,done){const car=G.car,h=G.horses[G.lead>=0?G.lead:G.ride];G.mode='cut';showHud(false);setRideUI(false);
  const P=[[L.car.x,L.car.z]].concat(ROAD);const path=dest==='venue'?P:P.slice().reverse();
  if(dest==='home'){parkCar('venue')}
  const steps=[];let T=0;
  // lasta
  steps.push({d:1.8,u(t){car.ramp.rotation.x=-1.3*sstep(0,.3,t)*(1-sstep(.8,1,t));
    if(h&&dest==='venue'){const back=new V3(0,0,-7.9).applyAxisAngle(new V3(0,1,0),car.g.rotation.y).add(car.g.position);const inside=new V3(0,0,-5.4).applyAxisAngle(new V3(0,1,0),car.g.rotation.y).add(car.g.position);
      if(t<.05){h.from=h.pos.clone()}const p=t<.5?h.from.clone().lerp(back,sstep(0,.5,t)):back.clone().lerp(inside,sstep(.5,.8,t));h.pos.copy(p);h.pos.y=groundH(p.x,p.z)+(t>.5&&t<.8?.3:0);
      h.yaw=dampA(h.yaw,t<.5?Math.atan2(back.x-h.pos.x,back.z-h.pos.z):car.g.rotation.y+Math.PI,8,1/60);h.speed=t<.8?2:0;if(t>.82)h.state='trailer'}
    else if(h)h.state='trailer';
    player.model.g.visible=t<.6;
    const cp=car.g.position,f=car.g.rotation.y;const bx=cp.x-Math.sin(f)*7,bz=cp.z-Math.cos(f)*7;camera.position.set(bx-Math.sin(f)*6+Math.cos(f)*7,4,bz-Math.cos(f)*6-Math.sin(f)*7);camera.lookAt(bx+Math.sin(f)*1.5,1.1,bz+Math.cos(f)*1.5)}});
  steps.push({d:5.2,s(){Snd.engineOn(true)},u(t){const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const p=pathPoint(path,e);const prev=car.g.position.clone();
    car.g.position.set(p.x,groundH(p.x,p.z),p.z);car.g.rotation.y=dampA(car.g.rotation.y,p.a,4,1/60);car.spin(prev.distanceTo(car.g.position));Snd.engineRev(Math.sin(t*Math.PI));
    const f=car.g.rotation.y;camera.position.set(p.x-Math.sin(f)*14+Math.cos(f)*5,6,p.z-Math.cos(f)*14-Math.sin(f)*5);camera.lookAt(p.x,1.2,p.z);G.cam.focus.set(p.x,1,p.z);
    if(Math.random()<.3)PT.emit('dust',p.x-Math.sin(f)*7,.2,p.z-Math.cos(f)*7,1,{r:1.5})}});
  steps.push({d:.6,s(){Snd.engineOn(false);fade(true,dest==='venue'?'🏆 Tävlingsplatsen':'🏡 Hemma igen')},u(){}});
  steps.push({d:.5,s(){parkCar(dest==='venue'?'venue':'home');player.model.g.visible=true;if(h)h.state='lead';done();},u(){}});
  steps.push({d:.4,s(){fade(false)},u(){}});
  G.cut={steps,i:-1,t:0,cam:null};}
function updateCut(dt){const c=G.cut;if(!c)return;if(c.i<0||c.t>=c.steps[c.i].d){c.i++;c.t=0;if(c.i>=c.steps.length){G.cut=null;return}const s=c.steps[c.i];if(s.s)s.s()}
  c.t+=dt;const s=c.steps[c.i];if(s&&s.u)s.u(clamp(c.t/s.d,0,1))}

  for(const s of[-1,1]){part(GEO.lo,dk,head,s*.065,.035,.115,.026,.032,.02);part(GEO.lo,new THREE.MeshBasicMaterial({color:'#fff'}),head,s*.072,.048,.13,.008,.009,.006);

  [[.09,bl*.62],[-.09,bl*.62],[.09,-bl*.62],[-.09,-bl*.62]].forEach(p=>{const l=new THREE.Group();l.position.set(p[0],BY,p[1]);root.add(l);part(cylG(.042,.036,LH,8),fur,l,0,-LH/2,0);part(GEO.lo,wh,l,0,-LH-.01,.02,.045,.03,.06);if(T.fluff)part(GEO.sph,fur,l,0,-LH+.03,0,.06,.06,.06);D.legs.push(l)});
  const tl=new THREE.Group();tl.position.set(0,BY+.15,-bl*.92);tl.rotation.x=-.8;root.add(tl);part(GEO.sph,fur,tl,0,.08,0,.05,.11,.05);part(GEO.lo,T.fluff?fur:wh,tl,0,.18,0,T.fluff?.08:.04,T.fluff?.08:.04,T.fluff?.08:.04);D.tail=tl;
  D.stick=part(cylG(.025,.025,.5,6),mat('#8a5a32'),head,0,-.07,.2);D.stick.rotation.z=Math.PI/2;D.stick.visible=false;

const DOGS=[];const STICK={s:null,m:null};

function updateDog(D,dt){D.t-=dt;D.barkT-=dt;D.wagT-=dt;let sit=false,bark=false;const pitch=1.15/DOGTYPES[D.d.type].sz;
  const vis=G.mode!=='comp'&&G.mode!=='cut';D.m.g.visible=vis;if(!vis)return;
  const own=dogOwnerPos(),od=Math.hypot(own.x-D.pos.x,own.z-D.pos.z),oy=G.ride>=0?G.horses[G.ride].yaw:player.yaw;
  if(od>45&&G.mode==='play'){D.pos.set(own.x-3-D.i,0,own.z-2);D.mode='roam';D.t=0}
  const loose=G.horses.find(h=>h.state==='loose');let want=0;
  if(D.mode==='fetch'&&STICK.s){const s=STICK.s;D.ft=(D.ft||0)+dt;if(D.ft>7&&!s.fly)s.p.set(D.pos.x,0,D.pos.z);D.tx=s.p.x;D.tz=s.p.z;want=s.fly?7:7.5;
    if(!s.fly&&Math.hypot(D.tx-D.pos.x,D.tz-D.pos.z)<.6){D.mode='return';D.ft=0;D.m.stick.visible=true;STICK.m.visible=false;Snd.pop()}}

    if(od<1.6){D.mode='roam';D.t=2;D.m.stick.visible=false;STICK.s=null;STICK.m.visible=true;STICK.m.position.set(own.x+Math.sin(player.yaw)*.9,groundH(own.x,own.z)+.03,own.z+Math.cos(player.yaw)*.9);STICK.m.rotation.set(0,player.yaw,Math.PI/2);D.wagT=2;quest('fetch')}}
  else if(loose&&G.mode==='play'){const hd=Math.hypot(loose.pos.x-D.pos.x,loose.pos.z-D.pos.z);
    if(D.mode!=='seek'&&D.mode!=='call')D.mode='seek';
    if(D.mode==='seek'){D.tx=loose.pos.x+2*Math.cos(D.ang);D.tz=loose.pos.z+2*Math.sin(D.ang);want=hd>3?7:0;if(hd<3.5){sit=true;if(D.barkT<0){D.barkT=1.2+D.i*.3;bark=true}if(od>22)D.mode='call'}}
    else{D.tx=own.x;D.tz=own.z;want=7;if(od<4){D.mode='seek';Snd.bark(pitch);D.barkT=.8}}}
  else{if(D.mode==='seek'||D.mode==='call'||D.mode==='fetch')D.mode='roam';
    if(od>7){D.tx=own.x-Math.sin(oy)*2+Math.cos(D.ang)*2.2;D.tz=own.z-Math.cos(oy)*2+Math.sin(D.ang)*2.2;want=Math.min(9,od*1.1)}
    else{if(D.t<=0){D.t=rand(2,5);if(Math.random()<.3)D.sitT=rand(2,4);else{D.tx=own.x+rand(-6,6);D.tz=own.z+rand(-6,6)}}
      const dd=Math.hypot(D.tx-D.pos.x,D.tz-D.pos.z);want=D.sitT>0?0:dd>.8?2.6:0;D.sitT-=dt;sit=D.sitT>0}}
  const dx=D.tx-D.pos.x,dz=D.tz-D.pos.z,dd=Math.hypot(dx,dz);if(dd<.5)want=0;

  D.pos.x+=Math.sin(D.yaw)*D.speed*dt;D.pos.z+=Math.cos(D.yaw)*D.speed*dt;collide(D.pos,.3);
  DOGS.forEach(o=>{if(o===D)return;const ex=D.pos.x-o.pos.x,ez=D.pos.z-o.pos.z,e=Math.hypot(ex,ez);if(e<.7&&e>.01){D.pos.x+=ex/e*(.7-e)*.5;D.pos.z+=ez/e*(.7-e)*.5}});
  D.pos.y=groundH(D.pos.x,D.pos.z);
  if(bark)Snd.bark(pitch);else if(Math.random()<dt*.03&&od<12)Snd.bark(pitch);
  if(surfaceAt(D.pos.x,D.pos.z)==='water'&&D.speed>1&&Math.random()<dt*8)PT.emit('splash',D.pos.x,LASTWY+.05,D.pos.z,2,{size:.5});
  D.m.g.position.copy(D.pos);D.m.g.rotation.y=D.yaw;D.m.animate(dt,{speed:D.speed,sit:sit&&D.speed<.5,wag:D.wagT>0||bark,bark})}

function updateLoose(h,dt){const w=h.w;w.t-=dt;let graze=false;const home=w.home||HIDEOUTS[0];

function parkCart(x,z,yaw){const c=CART;c.attached=false;scene.add(c.g);c.g.scale.setScalar(1);c.pos.set(x,groundH(x,z),z);c.yaw=yaw;c.g.position.copy(c.pos);c.g.rotation.set(0,yaw,0);

function trackPt(s,off=0){const T=TRACK,L2=T.L;s=((s%L2)+L2)%L2;const A=T.A,r=T.rc+off,a2=2*A,ar=Math.PI*T.rc;
  if(s<a2)return {x:T.cx-A+s,z:T.cz-r,yaw:Math.PI/2};
  if(s<a2+ar){const a=(s-a2)/T.rc;return {x:T.cx+A+r*Math.sin(a),z:T.cz-r*Math.cos(a),yaw:Math.atan2(Math.cos(a),Math.sin(a))}}

function horseValue(h){const d=h.d,br=breedOf(d.breed),m=d.medals||{1:0,2:0,3:0},st=d.st;
  const base=Math.round(br.p*.6),med=m[1]*80+m[2]*40+m[3]*20+(d.raceWins||0)*60,exp=Math.min(150,Math.round(d.xp*2));
  const avg=(st.hunger+st.thirst+st.clean+st.mood)/4,care=avg>85?.25:avg>70?.1:avg<40?-.2:0;
  const sub=base+med+exp,bonus=Math.round(sub*care);return {base,med,exp,care,bonus,total:Math.max(50,sub+bonus),m}}

  html+=`<div class="item" style="align-items:stretch;text-align:left"><b>Motståndare</b><div class="chips" id="rivalChips">${[['😊 Snälla',0],['🙂 Lagom',1],['😎 Proffs',2]].map(r=>`<button data-r="${r[1]}" class="${r[1]===lv?'on':''}">${r[0]}</button>`).join('')}</div><span>${['Lätt att vinna · lite mindre prispengar','Lagom svårt','Supersvårt · 50 % mer prispengar'][lv]}</span></div>`;
  html+=CLASSES.map((c,i)=>{const lock=false;return `<button class="btn ${lock?'white':i===0?'mint':i===1?'sky':'pink'}" data-c="${i}" ${lock||bad?'disabled':''}><span style="font-size:30px;display:inline">${lock?'🔒':c.em}</span><div>${c.name} <span>${lock?'Bli topp 3 i '+CLASSES[i-1].name+' först':c.d+' · Start '+c.fee+' 🪙 · Vinst '+c.prize[0]+' 🪙'}</span></div></button>`}).join('');
  $('#compList').innerHTML=html;$('#compList').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.rivals=+b.dataset.r;Snd.click();saveGame();openComp()});$('#compList').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{Snd.click();startComp(+b.dataset.c)})}
function showResults(all,place,prize,tf,c){openModal('#mRes');G.paused=false;$('#resTitle').textContent=place===1?'🏆 NI VANN!':place<=3?'🎉 Placering!':'Bra kämpat!';
  const rows=all.map((r,i)=>`<tr class="${r.me?'me':''}"><td>${i+1}.</td><td>${r.n}</td><td>${r.f} fel</td><td>${r.t.toFixed(1)} s</td></tr>`).join('');
  $('#resBody').innerHTML=`<div class="big-em">${['','🥇','🥈','🥉'][place]||'🎀'}</div><p class="center" style="font-weight:900;font-size:18px;margin:6px 0 12px">${place}:a plats · ${c.faults} hinderfel${tf?' + '+tf+' tidsfel':''} · +${prize} 🪙</p>
    <table class="res">${rows}</table><div class="row mt"><button class="btn pink" id="bHome">Åk hem 🚗</button></div>`;
  $('#bHome').onclick=()=>{Snd.click();goHome()}}

// ---------- styrning ----------
const jz=$('#joyzone'),joyEl=$('#joy'),knob=joyEl.querySelector('i');
function joyHome(){joyEl.style.left='calc(var(--sl) + 100px)';joyEl.style.top=(jz.clientHeight-100)+'px';knob.style.transform='';joyEl.classList.remove('on')}
function joyMove(e){let dx=e.clientX-G.joy.cx,dy=e.clientY-G.joy.cy;const R=60,l=Math.hypot(dx,dy);if(l>R){dx=dx/l*R;dy=dy/l*R}
  G.joy.x=dx/R;G.joy.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}
jz.addEventListener('pointerdown',e=>{if(G.joy.id!==null)return;G.joy.id=e.pointerId;const r=joyEl.getBoundingClientRect();G.joy.cx=r.left+r.width/2;G.joy.cy=r.top+r.height/2;
  try{jz.setPointerCapture(e.pointerId)}catch(_){}joyEl.classList.add('on');joyMove(e);e.preventDefault()});
jz.addEventListener('pointermove',e=>{if(e.pointerId!==G.joy.id)return;joyMove(e)});
const joyUp=e=>{if(e.pointerId!==G.joy.id)return;G.joy.id=null;G.joy.x=G.joy.y=0;joyHome()};
jz.addEventListener('pointerup',joyUp);jz.addEventListener('pointercancel',joyUp);
const drag={id:null,x:0,y:0};
canvas.addEventListener('pointerdown',e=>{if(drag.id!==null)return;drag.id=e.pointerId;drag.x=e.clientX;drag.y=e.clientY;drag.sx=e.clientX;drag.sy=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  if(G.mode==='care'){careDown=true;carePointer(e.clientX,e.clientY,0,true)}});
canvas.addEventListener('pointermove',e=>{if(G.mode==='care'&&G.sub==='brush'){const cur=$('#brushCur');cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`}
  if(e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(G.mode==='care'){carePointer(e.clientX,e.clientY,Math.hypot(dx,dy),false);return}
  if(G.mode==='creator'){G.stageYaw+=dx*.012;return}
  if(G.mode==='play'||G.mode==='comp'){G.cam.yaw-=dx*.0065;G.cam.pitch=clamp(G.cam.pitch+dy*.004,.06,.95);G.cam.lastDrag=G.t}});
const dragUp=e=>{if(e.pointerId!==drag.id)return;drag.id=null;careDown=null};
canvas.addEventListener('pointerup',dragUp);canvas.addEventListener('pointercancel',dragUp);
window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;G.keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();doJump()}if(e.code==='ShiftLeft'||e.code==='ShiftRight'){G.gallop=!G.gallop;$('#bGallop').classList.toggle('on',G.gallop)}
  if(e.code==='KeyE'||e.code==='Enter'){const f=$('#actA')._fn;if(f&&!$('#actA').hidden)f()}if(e.code==='KeyQ'){const f=$('#actB')._fn;if(f&&!$('#actB').hidden)f()}
  if(e.code==='KeyF'&&G.mode==='play'){if(G.ride>=0)dismount();else if(G.lead>=0)mount()}if(e.code==='Escape'){if(G.paused)closeModals();else if(G.mode==='play'||G.mode==='comp')openMenu()}});
window.addEventListener('keyup',e=>{G.keys[e.code]=false});
window.addEventListener('blur',()=>{G.keys={};G.joy.x=G.joy.y=0});

// ---------- prat-bubblor ----------
function updateBubbles(){const W=new V3();G.horses.forEach(h=>{if(!h.bub){h.bub=document.createElement('div');h.bub.className='bubble';h.bub.style.opacity=0;$('#hud').appendChild(h.bub)}
  const show=h.say&&h.say.t>0&&h.m.g.visible&&(G.mode==='play'||G.mode==='comp');if(!show){h.bub.style.opacity=0;return}
  h.m.head.getWorldPosition(W);W.y+=.75;const s=toScreen(W);if(s.z>1||s.x<-50||s.x>innerWidth+50||s.y<0){h.bub.style.opacity=0;return}
  if(h.bub.textContent!==h.say.text)h.bub.textContent=h.say.text;h.bub.style.opacity=1;h.bub.style.left=clamp(s.x,90,innerWidth-90)+'px';h.bub.style.top=s.y+'px'})}

// ---------- loop ----------
function step(dt){G.t+=dt;
  if(G.cut)updateCut(dt);
  const active=(G.mode==='play'||G.mode==='comp')&&!G.paused;
  if(active){if(G.ride>=0)updateRide(dt);else updateFoot(dt);updateNeeds(dt);pickShoes(dt);G.saveT+=dt;if(G.saveT>15){G.saveT=0;saveGame()}}
  if(G.mode==='care'){updateNeeds(dt*.4);updateCareFrame(dt)}
  if(G.mode==='creator')stageUpdate(dt);
  if(!G.paused||G.mode!=='play')updateHorses(dt);
  if(G.ride>=0){const h=G.horses[G.ride];const P=h.m.phase*Math.PI*2;const b=h.speed>2.6&&h.speed<6?Math.abs(Math.sin(P*2))*.07:h.speed>=6?(Math.sin(P)*.5+.5)*.05:0;
    player.model.animate(dt,{ride:true,cart:!!G.cart,bounce:G.cart?0:b,lean:G.race?.42:h.speed>6?.32:h.jumpT>=0?.45:.08,cheer:player.cheer>0});player.cheer-=dt}
  else if(G.mode==='title'){player.pos.set(-6,0,-6);player.model.g.position.set(-6,0,-6);player.model.g.rotation.y=-2.2;player.model.animate(dt,{speed:0})}
  STABLE.doors.forEach(d=>{d.rotation.y=damp(d.rotation.y,d.userData.open?-1.9:0,6,dt)});updateGate(dt);
  G.jumps.home.forEach(J=>J.update(dt));G.jumps.venue.forEach(J=>J.update(dt));
  PT.update(dt);CLOUDS.update(dt);GULLS.update(G.t);SHOES.update(G.t);VENUE.crowd.update(G.t,dt);
  waterU.uT.value=G.t;grassU.uT.value=G.t;waterU.uCam.value.copy(camera.position);BEACH.boat.position.y=-.2+Math.sin(G.t*.9)*.15;BEACH.boat.rotation.z=Math.sin(G.t*.7)*.06;
  updateRope();updateCamera(dt);
  G.uiT+=dt;if(G.uiT>.16){G.uiT=0;updateActs();updateHudSlow()}
  updateBubbles();
  if(G.mode==='play'||G.mode==='care'||G.mode==='title')updateDogs(dt);
  updateCart(dt);if(G.mode==='play')updateMountain();
  if(Snd.ctx){const fx=G.cam.focus.x;Snd.waves(clamp(1-(L.shore-fx)/45,0,1)*.28,G.t);if(fx<70&&Math.random()<dt*.25)Snd.chirp()}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000)||.016;last=now;if(G.manual)return;step(dt);renderer.render(scene,camera)}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();PT.mat.uniforms.uScale.value=h*.95;frameMode(FRAME);joyHome()}
window.addEventListener('resize',()=>setTimeout(resize,60));
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});
window.addEventListener('pagehide',saveGame);

// ---------- start ----------
const hadSave=loadGame();Snd.muted=!!S.muted;
initWorld();
if(hadSave){$('#bPlay').textContent='Fortsätt';$('#bNew').hidden=false}
G.mode='title';resize();requestAnimationFrame(loop);
if(/[?&]icon/.test(location.search)){G.mode='icon';$('#title').hidden=true;scene.background=new THREE.Color('#ff86bd');scene.fog=null;sky.visible=false;
  const h=G.horses[0];h.d.coat='palomino';h.d.mane='#ff5fa2';h.d.face='blaze';h.d.pattern='none';h.d.acc={glasses:false,crown:true,bows:true,glitter:false};h.m.setLook(h.d);h.state='icon';h.pos.set(0,0,-60);h.yaw=.9;
  G.cam.focus.set(0,0,-60);scene.children.forEach(c=>{if(c!==h.m.g&&!c.isLight&&c!==sun.target)c.visible=false});h.m.setTack(false);
  updateCamera=function(){const W=new V3();h.m.head.getWorldPosition(W);const fx=Math.sin(h.yaw),fz=Math.cos(h.yaw),sx=Math.cos(h.yaw),sz=-Math.sin(h.yaw);camera.position.set(W.x+fx*1.0+sx*1.35,W.y+.3,W.z+fz*1.0+sz*1.35);camera.lookAt(W.x+fx*.1-sx*.08,W.y-.18,W.z+fz*.1-sz*.08);sunFollow(W)}}
window.__SPEL={step:(dt,n=1)=>{for(let i=0;i<n;i++)step(dt)},manual:v=>{G.manual=v},G,S,player,
  info:()=>({mode:G.mode,ride:G.ride,lead:G.lead,paused:G.paused,player:player.pos.toArray().map(v=>+v.toFixed(2)),horses:G.horses.map(h=>({name:h.d.name,state:h.state,pos:h.pos.toArray().map(v=>+v.toFixed(2)),st:Object.fromEntries(Object.entries(h.d.st).map(([k,v])=>[k,Math.round(v)])),speed:+h.speed.toFixed(2),jumpY:+h.jumpY.toFixed(2),dirt:h.d.dirt})),
    money:S.money,quest:curQuest()&&curQuest().id,acts:ACTS.map(a=>a.label),calls:renderer.info.render.calls,tris:renderer.info.render.triangles,comp:G.comp&&{t:+G.comp.t.toFixed(1),next:G.comp.next,faults:G.comp.faults,done:G.comp.done}}),
  setJoy:(x,y)=>{G.joy.x=x;G.joy.y=y},act:i=>ACTS[i]&&ACTS[i].fn(),interactions,doJump,travel,startComp,enterCare,exitCare,careAct,startSub,endSub,carePointer,mount,dismount,takeOut,putIn,releaseHage,fetchHage,openCreator,startPlay,openShop,openMenu,openComp,buy,goHome,toScreen,
  render:()=>renderer.render(scene,camera)};

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){})})}</script>
